<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#2c6cb5"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Blue Background (Padded for Maskable Safe Zone) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Diary Container with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Diary Book -->
    <rect x="96" y="80" width="320" height="352" rx="24" fill="url(#bookGrad)"/>
    
    <!-- Spine binding (left bar) -->
    <rect x="96" y="80" width="52" height="352" rx="20" fill="#34495e"/>
    <rect x="128" y="80" width="20" height="352" fill="#2c3e50"/>
    
    <!-- Stitch binding loops on spine -->
    <path d="M120 125 h16 M120 165 h16 M120 205 h16 M120 245 h16 M120 285 h16 M120 325 h16 M120 365 h16 M120 405 h16" 
          stroke="#f1c40f" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Number Grid & Stitch Marks on Diary Page -->
  <!-- Header bar inside page -->
  <rect x="170" y="110" width="220" height="32" rx="6" fill="#e8f0fe"/>
  <text x="280" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">STITCH DIARY</text>

  <!-- Grid Table simulation -->
  <g stroke="#cbd5e1" stroke-width="2">
    <!-- Grid outer border -->
    <rect x="170" y="155" width="220" height="180" rx="8" fill="#ffffff"/>
    
    <!-- Horizontal grid lines -->
    <line x1="170" y1="195" x2="390" y2="195"/>
    <line x1="170" y1="235" x2="390" y2="235"/>
    <line x1="170" y1="275" x2="390" y2="275"/>
    <line x1="170" y1="315" x2="390" y2="315"/>
    
    <!-- Vertical grid lines -->
    <line x1="225" y1="155" x2="225" y2="335"/>
    <line x1="280" y1="155" x2="280" y2="335"/>
    <line x1="335" y1="155" x2="335" y2="335"/>
  </g>

  <!-- Number and Stitch symbols in cells -->
  <g font-family="'Segoe UI', monospace, sans-serif" font-size="15" font-weight="bold" fill="#4a90e2" text-anchor="middle">
    <!-- Column headers -->
    <text x="197" y="180" fill="#34495e" font-size="13">#1</text>
    <text x="252" y="180" fill="#34495e" font-size="13">#2</text>
    <text x="307" y="180" fill="#34495e" font-size="13">#3</text>
    <text x="362" y="180" fill="#34495e" font-size="13">#4</text>
    
    <!-- Row 1 data -->
    <text x="197" y="220" fill="#27ae60">120</text>
    <text x="252" y="220">45</text>
    <text x="307" y="220">350k</text>
    <text x="362" y="220" fill="#e74c3c">+8</text>

    <!-- Row 2 data -->
    <text x="197" y="260">95</text>
    <text x="252" y="260" fill="#27ae60">160</text>
    <text x="307" y="260">400k</text>
    <text x="362" y="260">-2</text>

    <!-- Row 3 data -->
    <text x="197" y="300" fill="#2980b9">210</text>
    <text x="252" y="300">80</text>
    <text x="307" y="300" fill="#27ae60">12k</text>
    <text x="362" y="300">+15</text>
  </g>

  <!-- Decorative sewing needle with golden thread -->
  <g transform="translate(340, 310) rotate(-35)">
    <!-- Thread curling out -->
    <path d="M-60 100 C -30 60, -10 90, 10 40 C 20 10, 25 20, 28 5" 
          fill="none" stroke="#f39c12" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round"/>
    <!-- Silver needle -->
    <path d="M28 6 L32 -55 L35 6 Z" fill="#b0bec5"/>
    <ellipse cx="32" cy="-42" rx="1.5" ry="5" fill="#34495e"/>
    <circle cx="32" cy="-55" r="2.5" fill="#78909c"/>
  </g>

  <!-- Bottom summary badge inside diary -->
  <rect x="170" y="352" width="220" height="42" rx="8" fill="#e1f5fe"/>
  <text x="280" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0288d1" text-anchor="middle">TOTAL STITCH: 400K</text>
</svg>
